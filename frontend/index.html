    <style>
      /* Only a launch that takes longer than the app does to mount ever shows
         this: it stays invisible for the first 500ms, which is past the point
         the shell has painted. The mark is drawn rather than loaded, so the
         splash costs no request and no bytes. */
      html,
      body {
        background: #0c0a09;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        animation: boot-in 0.3s ease-out 0.5s forwards;
      }
      /* The bar is the app's own header, copied markup and all, so the swap is
         seamless. Its mock parts must not eat the drag. */
      .boot-bar-mock {
        pointer-events: none;
        cursor: default;
      }
      .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
      }
      .boot-halo {
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 109, 214, 0.2), rgba(255, 109, 214, 0) 62%);
        animation: boot-breathe 3.4s ease-in-out 0.5s infinite;
      }
      .boot-icon {
        position: relative;
        width: 68px;
        height: 104px;
        display: block;
        filter: drop-shadow(0 16px 30px rgba(255, 109, 214, 0.22));
      }
      @keyframes boot-in {
        to { visibility: visible; opacity: 1; }
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        html,
      body {
        background: #0c0a09;
      }
      .boot { animation-duration: 0.01s; }
        .boot-halo { animation: none; }
      }
    </style>
  </head>

    <script>
      // The window bar before the shell exists. Wails' own draggable hook is a
      // no-op on Linux (its message channel is native-only), so the drag is done
      // here over the same transport the runtime uses: Window methods, posted to
      // /wails/runtime (minimise 17, toggle maximise 39, close 2, set position 24,
      // args are named: {x, y}). A phone has no window to move: there the bar is
      // removed and the splash keeps its mark alone.
      (() => {
        const bar = document.querySelector(".boot-bar");
        if (!bar) return;
        const android =
          /android/i.test(navigator.userAgent) ||
          window._wails?.environment?.OS === "android";
        const touchOnly =
          matchMedia("(pointer: coarse)").matches &&
          !matchMedia("(any-pointer: fine)").matches;
        if (android || touchOnly) {
          bar.remove();
          return;
        }

        const send = (method, args) =>
          fetch("/wails/runtime", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-wails-client-id": "boot",
            },
            body: JSON.stringify(args ? { object: 6, method, args } : { object: 6, method }),
          });

        for (const button of document.querySelectorAll(".boot-controls button")) {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            void send(Number(button.dataset.window)).catch(() => {});
          });
        }

        // Drag over the host's own numbers: the window's position comes from the
        // host (method 0) and only the pointer's *movement* is added to it, so a
        // scale or origin mismatch between screenX and the host's coordinates
        // cannot teleport the window.
        let drag = null;
        let frame = 0;
        let next = null;

        bar.addEventListener("mousedown", (event) => {
          if (event.button !== 0) return;
          if (event.target.closest(".boot-controls")) return;
          const sx = event.screenX;
          const sy = event.screenY;
          event.preventDefault();
          drag = null;
          void send(0)
            .then((response) => response.json())
            .then((position) => {
              drag = { x: position.x, y: position.y, sx, sy };
            })
            .catch(() => {});
        });

        window.addEventListener("mousemove", (event) => {
          if (!drag) return;
          next = {
            x: drag.x + (event.screenX - drag.sx),
            y: drag.y + (event.screenY - drag.sy),
          };
          if (frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            if (!next) return;
            void send(24, next).catch(() => {});
          });
        });

        const stop = () => {
          drag = null;
          next = null;
        };
        window.addEventListener("mouseup", stop);
        window.addEventListener("blur", stop);
      })();
    </script>
