name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run (comma-separated: linux,flatpak,android,windows,macos). Defaults to all."
        required: false
        default: all
      tag_name:
        description: "Release tag to create for manual runs. Defaults to the pushed tag."
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: ${{ !github.event.inputs.jobs || github.event.inputs.jobs == 'all' || contains(github.event.inputs.jobs, 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package (.deb, .rpm, .AppImage, AUR)
        run: wails3 task package VERSION="${GITHUB_REF_NAME#v}"
      - name: Smoke-test the AppImage across distributions
        run: |
          set -euo pipefail
          app=$(ls bin/*.AppImage | head -1)
          # The statically linked runtime is what removes the libfuse2 dependency
          # (mounting via FUSE is exercised by the maintainers, not in the container).
          file "$app" | grep -q "static-pie linked"

          for image in debian:12 ubuntu:24.04 fedora:41; do
            echo "::group::smoke-test $image"
            docker run --rm -v "$PWD/$app:/app.AppImage:ro" "$image" bash -lc '
              set -e
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 >/dev/null
              else
                dnf install -y -q gtk3 webkit2gtk4.1 >/dev/null
              fi
              out=$(timeout 20 /app.AppImage --appimage-extract-and-run 2>&1 || true)
              echo "$out"
              echo "$out" | grep -q "cannot open display"
            '
            echo "::endgroup::"
          done

          # Negative path: on a host without WebKitGTK the wrapper must name the
          # missing packages instead of failing inside the dynamic loader.
          out=$(docker run --rm -v "$PWD/$app:/app.AppImage:ro" ubuntu:24.04 bash -lc \
            'timeout 20 /app.AppImage --appimage-extract-and-run 2>&1 || true')
          echo "$out"
          echo "$out" | grep -q "missing system libraries"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.*
            bin/*.AppImage

  flatpak:
    needs: [linux]
    if: ${{ !github.event.inputs.jobs || github.event.inputs.jobs == 'all' || contains(github.event.inputs.jobs, 'linux') || contains(github.event.inputs.jobs, 'flatpak') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: packages
      - name: Reuse the binary from the AppImage
        run: |
          app=$(ls packages/*.AppImage | head -1)
          chmod +x "$app"
          "$app" --appimage-extract
          mkdir -p bin
          cp squashfs-root/usr/bin/jota bin/jota
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub --repo=flatpak-repo flatpak-build \
            build/linux/flatpak/io.github.jota_music.jota.yml
          flatpak build-bundle flatpak-repo jota.flatpak io.github.jota_music.jota
      - name: Smoke-test the Flatpak
        run: |
          flatpak install --user -y ./jota.flatpak
          out=$(timeout 30 dbus-run-session -- flatpak run io.github.jota_music.jota 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "cannot open display"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak
          path: jota.flatpak

  android:
    if: ${{ !github.event.inputs.jobs || github.event.inputs.jobs == 'all' || contains(github.event.inputs.jobs, 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}
            go-${{ runner.os }}-
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package release APK
        run: wails3 task android:package VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: bin/*.apk

  windows:
    if: ${{ !github.event.inputs.jobs || github.event.inputs.jobs == 'all' || contains(github.event.inputs.jobs, 'windows') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install NSIS
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: nsis
          version: 1.0
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Build unsigned NSIS installer (per-user, no UAC)
        run: wails3 task windows:create:nsis:installer VERSION="${GITHUB_REF_NAME#v}" INSTALL_SCOPE=user
      - name: Name the raw executable for the in-app updater
        run: cp bin/jota.exe bin/jota-windows-amd64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            bin/*-installer.exe
            bin/jota-windows-amd64.exe

  macos:
    if: ${{ !github.event.inputs.jobs || github.event.inputs.jobs == 'all' || contains(github.event.inputs.jobs, 'macos') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package unsigned universal .dmg
        run: wails3 task darwin:package:dmg VERSION="${GITHUB_REF_NAME#v}"
      - name: Zip the .app for in-app updates
        run: ditto -c -k --keepParent bin/jota.app bin/jota-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: |
            bin/*.dmg
            bin/jota-macos.zip

  publish:
    needs: [linux, android, windows, flatpak, macos]
    # Runs even when only a subset of jobs was selected, so a manual
    # macos-only run can still (re)create the release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Checksums
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed 's#  dist/[^/]*/#  #' > SHA256SUMS
          cat SHA256SUMS
      - name: Collect release files
        id: collect
        run: |
          {
            echo "files<<EOF"
            find dist \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.*' \
              -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.apk' \
              -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -type f | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Delete existing release if present
        run: |
          tag="${{ github.event.inputs.tag_name || github.ref_name }}"
          if gh release view "$tag" --json name -q .name >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          prerelease: ${{ startsWith(github.event.inputs.tag_name || github.ref_name, 'v0.0.') }}
          files: |
            ${{ steps.collect.outputs.files }}
            SHA256SUMS
