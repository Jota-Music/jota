name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libvorbis-dev libflac-dev libmpg123-dev libasound2-dev
          version: 1.0
      - name: Install FUSE (AppImage)
        run: sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package (.deb, .rpm, .AppImage, AUR)
        run: wails3 task package VERSION="${GITHUB_REF_NAME#v}"
      - name: Smoke-test the AppImage on Debian
        run: |
          docker run --rm -v "$PWD/bin:/app:ro" debian:12 bash -lc '
            set -e
            apt-get update -qq
            apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 libasound2 >/dev/null
            app=$(ls /app/*.AppImage | head -1)
            out=$(timeout 20 "$app" --appimage-extract-and-run 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "cannot open display"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package release APK
        run: wails3 task android:package VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: bin/*.apk

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install NSIS
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: nsis
          version: 1.0
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Build unsigned NSIS installer
        run: wails3 task windows:create:nsis:installer VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: bin/*-installer.exe

  publish:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Checksums
        working-directory: dist
        run: find . -type f -exec sha256sum {} + | sort -k2 > "$GITHUB_WORKSPACE/SHA256SUMS"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: |
            dist/linux-packages/*.deb
            dist/linux-packages/*.rpm
            dist/linux-packages/*.AppImage
            dist/android-apk/*.apk
            dist/windows-installer/*-installer.exe
            SHA256SUMS
