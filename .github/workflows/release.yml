name: release

on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libvorbis-dev libflac-dev libmpg123-dev libasound2-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package (.deb, .rpm, .AppImage, AUR)
        run: wails3 task package VERSION="${GITHUB_REF_NAME#v}"
      - name: Smoke-test the AppImage on Debian
        run: |
          docker run --rm -v "$PWD/bin:/app:ro" debian:12 bash -lc '
            set -e
            apt-get update -qq
            apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 libasound2 >/dev/null
            app=$(ls /app/*.AppImage | head -1)
            out=$(timeout 20 "$app" --appimage-extract-and-run 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "cannot open display"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Package release APK
        run: wails3 task android:package VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Build unsigned NSIS installer
        run: wails3 task windows:create:nsis:installer VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: bin/*-installer.exe

  publish:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        working-directory: dist
        run: find . -type f -exec sha256sum {} + | sort -k2 > "$GITHUB_WORKSPACE/SHA256SUMS"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: |
            dist/linux-packages/*.deb
            dist/linux-packages/*.rpm
            dist/linux-packages/*.AppImage
            dist/android-apk/*.apk
            dist/windows-installer/*-installer.exe
            SHA256SUMS
