name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Pinned, not ubuntu-latest: the label moved to 26.04, whose archive already
    # served a package it does not host (a 404 on gstreamer1.0-x amd64v3 broke
    # the GTK install).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        # Plain apt, not a cached install: the cache action saves its entry even
        # when the download failed, so the next run restores no packages and the
        # job dies on pkg-config instead of on the download that broke. The
        # timeouts are the other half: a stalled mirror once held this step for
        # the whole job budget, and a red main tells nobody anything then.
        run: |
          apt="sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: test -z "$(gofmt -l main.go icon_linux.go icon_notlinux.go internal/)"
      - name: vet
        run: go vet -tags gtk3 ./internal/...
      - name: test
        run: go test -tags gtk3 -short -race ./internal/... -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  app:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        # Plain apt, not a cached install: the cache action saves its entry even
        # when the download failed, so the next run restores no packages and the
        # job dies on pkg-config instead of on the download that broke. The
        # timeouts are the other half: a stalled mirror once held this step for
        # the whole job budget, and a red main tells nobody anything then.
        run: |
          apt="sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build
      - name: Build app binary (embeds frontend/dist)
        run: go build -tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s" -o bin/jota .
      - name: Size budget
        # The frontend is embedded here, so this same binary is what every
        # release artifact wraps: a change that grows it fails on the push,
        # before a tag turns it into a download for every user.
        run: |
          size=$(stat -c %s bin/jota)
          echo "bin/jota: ${size} bytes (budget ${BINARY_BUDGET})"
          test "$size" -le "$BINARY_BUDGET"
        env:
          BINARY_BUDGET: 29500000
