name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux (GTK3 / WebKit2GTK 4.1) build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: test -z "$(gofmt -l main.go icon_linux.go icon_notlinux.go internal/)"
      - name: vet
        run: go vet -tags gtk3 ./internal/...
      - name: build
        run: go build -tags gtk3 ./internal/...
      - name: test
        run: go test -tags gtk3 ./internal/... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
