version: '3'

vars:
  APP_NAME: "jota"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Application version, single source of truth: build/config.yml `info.version`.
  # Override per-release with: wails3 task build -- VERSION=2.0.0
  VERSION:
    sh: 'grep -E "version: *\"[0-9]+\.[0-9]+\.[0-9]+" build/config.yml | head -1 | sed -E "s/.*version: *\"([^\"]+)\".*/\1/"'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  android:
    desc: Build release APK for arm64 (phones)
    cmds:
      - task: android:package
        vars:
          ARCH: arm64

  android:emu:
    desc: Build release APK for emulator (amd64)
    cmds:
      - task: android:package
        vars:
          ARCH: amd64

  android:fat:
    desc: Build fat APK (arm64 + amd64)
    cmds:
      - task: android:package:fat

  aab:
    desc: Build AAB for Play Store
    cmds:
      - task: android:bundle
        vars:
          ARCH: arm64

  run:android:
    desc: Build debug and run in emulator
    cmds:
      - task: android:run

  deploy:android:
    desc: Deploy release APK to connected phone via USB
    cmds:
      - task: android:deploy-device
        vars:
          ARCH: arm64

  test:appimage:
    desc: Build the Linux AppImage and run the release smoke tests locally (podman)
    cmds:
      - task: linux:create:appimage
      - ./build/linux/test-appimage.sh

  test:flatpak:
    desc: Build and smoke-test the Flatpak locally
    cmds:
      - ./build/linux/flatpak/build-local.sh

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml
