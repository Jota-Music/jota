# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "jota"
arch: ${GOARCH}
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Self-hosted music streaming app"
vendor: "Jota"
homepage: "https://github.com/Jota-Music/jota"
license: "GPL-3.0-only"
release: "1"

contents:
  - src: "./bin/jota"
    dst: "/usr/local/bin/jota"
  - src: "./build/linux/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/jota.png"
  - src: "./build/linux/jota.desktop"
    dst: "/usr/share/applications/jota.desktop"
  - src: "./build/linux/io.github.jota_music.jota.appdata.xml"
    dst: "/usr/share/metainfo/io.github.jota_music.jota.appdata.xml"

# The Linux build uses the GTK3 / WebKit2GTK 4.1 stack (-tags gtk3).
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"

# When the app moves to GTK4 / WebKitGTK 6.0 (Wails v3 default, -tags gtk4),
# replace the depends/overrides above with:
