# Flatpak manifest for Jota.
#
# The GNOME runtime already ships GTK3 + WebKit2GTK 4.1, so the app only bundles
# its own binary plus the audio decoder libraries (whose sonames differ between
# the build host and the runtime, e.g. libFLAC.so.12 vs .so.14).
#
# `lib/` is not committed; CI fills it from the AppImage. To build locally:
#
#   wails3 task package
#   bin/jota-x86_64.AppImage --appimage-extract
#   mkdir -p build/linux/flatpak/lib
#   cp squashfs-root/usr/lib/*.so* build/linux/flatpak/lib/
#   flatpak-builder --user --install --force-clean build-dir build/linux/flatpak/io.github.jota_music.jota.yml
#
app-id: io.github.jota_music.jota
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: jota
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Wails single-instance owns a D-Bus name derived from the app UniqueID
  # (main.go: "com.jotamusic.jota" -> org.wails_app_com_jotamusic_jota.SingleInstance).
  - --own-name=org.wails_app_com_jotamusic_jota.SingleInstance
modules:
  - name: jota
    buildsystem: simple
    build-commands:
      - install -Dm755 jota /app/bin/jota
      - install -Dm644 io.github.jota_music.jota.desktop /app/share/applications/io.github.jota_music.jota.desktop
      - install -Dm644 io.github.jota_music.jota.appdata.xml /app/share/metainfo/io.github.jota_music.jota.appdata.xml
      - install -Dm644 appicon.png /app/share/icons/hicolor/512x512/apps/io.github.jota_music.jota.png
      - mkdir -p /app/lib
      - find . -maxdepth 2 -name '*.so*' -exec cp -a {} /app/lib/ \;
    sources:
      - type: file
        path: ../../../bin/jota
      - type: dir
        path: lib
      - type: file
        path: io.github.jota_music.jota.desktop
      - type: file
        path: ../io.github.jota_music.jota.appdata.xml
      - type: file
        path: ../appicon.png
