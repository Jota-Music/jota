plugins {
    id 'com.android.application'
}

// Encodes x.y.z into a monotonic versionCode (x*10000 + y*100 + z) so each
// release build is greater than or equal to the previous one. Android requires
// the installed versionCode <= new versionCode to accept an in-app update.
static int parseVersionCode(String v) {
    def parts = v.tokenize(".")
    def major = parts.size() > 0 ? (parts[0].replaceAll(/[^0-9]/, "") ?: "0").toInteger() : 0
    def minor = parts.size() > 1 ? (parts[1].replaceAll(/[^0-9]/, "") ?: "0").toInteger() : 0
    def patch = parts.size() > 2 ? (parts[2].replaceAll(/[^0-9]/, "") ?: "0").toInteger() : 0
    def code = major * 10000 + minor * 100 + patch
    return code < 1 ? 1 : code
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.jotamusic.jota"
        minSdk 21
        targetSdk 35
        // Version mirrors the release VERSION (x.y.z) when provided via
        // -Pversion=..., so Android accepts in-app updates over prior builds.
        versionCode parseVersionCode(project.findProperty("version") ?: "0.0.0")
        versionName project.findProperty("version") ?: "0.0.0"

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasEnvKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    Properties keyProps = new Properties()
    def propsFile = rootProject.file("keystore.properties")
    if (propsFile.exists()) {
        keyProps.load(propsFile.newInputStream())
    }

    // The signing key lives outside the repo: in ANDROID_KEYSTORE_* env vars
    // (CI) or in a gitignored keystore.properties (local). The build fails
    // loudly if neither is present — never fall back to the debug keystore,
    // or in-app APK updates and Play uploads silently change signer.
    def signingProps = [
        storeFile: hasEnvKeystore ? file(keystoreFile)
                                  : (keyProps.storeFile ? rootProject.file(keyProps.storeFile) : null),
        storePassword: hasEnvKeystore ? System.getenv("ANDROID_KEYSTORE_PASSWORD") : keyProps.storePassword,
        keyAlias: hasEnvKeystore ? System.getenv("ANDROID_KEY_ALIAS") : keyProps.keyAlias,
        keyPassword: hasEnvKeystore ? System.getenv("ANDROID_KEY_PASSWORD") : keyProps.keyPassword,
    ]
    def missing = signingProps.findAll { it.value == null || it.value.toString().trim().isEmpty() }.keySet()
    if (!missing.isEmpty()) {
        def hint = hasEnvKeystore
            ? "set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD"
            : "create a gitignored build/android/keystore.properties with storeFile, storePassword, keyAlias and keyPassword"
        throw new GradleException("Android signing is not configured (missing: ${missing.join(', ')}): ${hint}.")
    }

    signingConfigs {
        // All builds sign with the same release keystore so the signature is
        // identical no matter where the build runs.
        release {
            storeFile signingProps.storeFile
            storePassword signingProps.storePassword
            keyAlias signingProps.keyAlias
            keyPassword signingProps.keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.browser:browser:1.8.0'
}
